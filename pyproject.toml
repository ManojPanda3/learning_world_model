[project]
name = "learning-world-model"
version = "0.1.0"
description = "A compact PyTorch implementation of DreamerV3"
readme = "README.md"
authors = [
    { name = "Manoj Panda", email = "manojpandawork@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gymnasium[classic-control]>=1.4.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "torch>=2.15.0",
]

[project.scripts]
dreamer = "learning_world_model.train:main"
learning-world-model = "learning_world_model.train:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
